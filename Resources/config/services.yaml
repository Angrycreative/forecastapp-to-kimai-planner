services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    KimaiPlugin\ForecastImportBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Forecast/ForecastApiException.php'
            - '../../Forecast/ForecastCredentials.php'
            - '../../Forecast/ForecastData.php'
            - '../../Import/{ImportResult,MappingSet,Plan,PlannedAssignment,PlannedPart,Preview,ProjectCandidate,ProjectSuggester,ReadSummary,Target}.php'
            - '../../Migrations/'
            - '../../Resources/'
            - '../../tests/'
            - '../../tools/'
            - '../../vendor/'

    KimaiPlugin\ForecastImportBundle\Import\WorkDayCalendar: '@KimaiPlugin\ForecastImportBundle\Import\KimaiWorkDayCalendar'

    # public holidays only exist in planner versions that ship a holiday provider; without one the calendar ignores them
    KimaiPlugin\ForecastImportBundle\Import\KimaiWorkDayCalendar:
        arguments:
            $holidayProvider: '@?KimaiPlugin\PlannerBundle\Holiday\HolidayProviderInterface'

    KimaiPlugin\ForecastImportBundle\Import\TokenVault:
        arguments:
            $secret: '%kernel.secret%'

    # reserved time is built into the planner since 2.2.0; older planners have none to offer
    KimaiPlugin\ForecastImportBundle\Import\ReservationCatalogue:
        arguments:
            $reservations: '@?KimaiPlugin\PlannerBundle\Repository\ReservationRepository'
